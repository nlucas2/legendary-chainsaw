<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e2e" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("copilot-sessions.theme") || "auto";
          const dark =
            preference === "dark" ||
            (preference === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#1e1e2e" : "#f4ecd8");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta
      name="description"
      content="Work with GitHub Copilot CLI sessions from desktop or the web."
    />
    <title>Copilot Sessions</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
